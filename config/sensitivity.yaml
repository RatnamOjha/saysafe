# How sensitive a reply is. Levels: public < personal < sensitive < secret.
# The final level is the highest any layer returns.

# Layer a: named regex rules (patterns live in earshot/privacy/detect.py; the level
# each rule assigns and its keyword lists live here).
rules:
  otp_code: secret          # 4-8 digits near code / OTP / verification / PIN / passcode
  password: secret          # "password is X"
  card_number: secret       # 13-19 digits that pass the Luhn check
  ssn: secret               # 123-45-6789
  account_number: secret    # "account number 12345678"
  money_personal: sensitive # an amount near balance / owe / due / salary / bill ...
  street_address: sensitive # 2150 Mission Street
  health: sensitive         # conditions, meds, results, specialists, "Dr. X", doses and lab units
  legal: sensitive          # lawyers, court, custody ...
  email_sender: personal    # "Email from X"

code_words: [code, otp, verification, verify, passcode, pin, one-time, security code, login code]
not_code_words: [zip, postal, area, country, error, status, room, dress, source, promo]

money_words: [balance, owe, owes, owed, due, salary, paycheck, bill, bills, debt, rent,
              overdraft, credit limit, statement, spent, spending, income, loan, mortgage,
              deposit, deposited, savings, checking, net worth, tax refund, invoice]

health_words: [dermatologist, oncologist, psychiatrist, psychologist, therapist, therapy,
               cardiologist, gynecologist, urologist, neurologist, endocrinologist,
               diagnosis, diagnosed, prescription, prescribed, medication, meds, dosage,
               lab results, test results, blood test, biopsy, mri, ct scan, x-ray,
               cholesterol, diabetes, insulin, blood pressure, depression, anxiety,
               adhd, pregnancy, pregnant, std, hiv, chemo, rash, eczema, acne,
               antidepressant, sertraline, lexapro, adderall, metformin, ozempic,
               dermatology, oncology, psychiatry,
               blood work, bloodwork, lab result, lab results, labs, triglycerides, ldl, hdl,
               a1c, hba1c, vitamin d, thyroid, nodule, tumor, cancer, pathology, ekg, ecg,
               sclerosis, hypertension, asthma, arthritis, migraine, infection, chemotherapy,
               inhaler, dose, diagnosis of, stage 1, stage 2, stage 3, stage 4, symptoms,
               treatment for, undergoing treatment, surgery, physical therapy,
               blood sugar, glucose]

legal_words: [lawyer, attorney, lawsuit, court, court date, custody, divorce, subpoena,
              arrest, arrested, probation, bail, eviction, restraining order, settlement, dui,
              case number, docket, hearing]

# Layer b: source hints from the agent set a minimum level.
source_min_level:
  otp: secret
  bank: sensitive
  health: sensitive
  email: personal
  calendar: personal
  public: public

# Layer c: optional LLM classifier (EARSHOT_DETECT_LLM=1). If it fails and no other
# layer fired, the result is personal, never public.
llm:
  timeout_s: 1.2
  fallback_level: personal
