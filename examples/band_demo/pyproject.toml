[project]
name = "band-demo"
version = "0.1.0"
description = "Band simulator: a screenless voice assistant with saysafe in front of it."
requires-python = ">=3.10"
dependencies = [
    "saysafe[voice]",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "httpx",
    "sounddevice",
    "faster-whisper",
    "piper-tts",
    "openai",
    "typer",
    "rich",
]

[project.scripts]
band-demo = "band_demo.cli:app"

[tool.uv.sources]
saysafe = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/band_demo"]
