site_name: saysafe
site_description: Privacy and approval guardrails for voice agents.
repo_url: https://github.com/RatnamOjha/saysafe
repo_name: RatnamOjha/saysafe
edit_uri: edit/main/docs/
copyright: Apache-2.0. Independent project by Ratnam Ojha.

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Home: index.md
  - Guides:
      - Private replies: privacy.md
      - Approvals: approvals.md
      - Voice ID: voice.md
      - Pipecat: pipecat.md
  - Threat model: threat-model.md
  - Benchmarks: benchmarks.md
  - API reference: reference.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets: {base_path: ["."], check_paths: true}

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            docstring_style: google

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
