[project]
name = "earshot"
version = "0.1.0"
description = "Voice-locked approvals and private replies for a screenless AI wearable."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "numpy",
    "soundfile",
    "sounddevice",
    "torch",
    "torchaudio",
    "speechbrain",
    "faster-whisper",
    "silero-vad",
    "piper-tts",
    "openai",
    "httpx",
    "cryptography",
    "keyring",
    "num2words",
    "rapidfuzz",
    "jellyfish",
    "librosa",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "rich",
    "typer",
]

[project.scripts]
earshot = "earshot.cli:app"

[dependency-groups]
dev = ["pytest", "ruff", "hypothesis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["earshot"]

# CPU-only torch. macOS wheels on PyPI are already CPU builds; on Linux (CI)
# pull from the PyTorch CPU index so we don't download CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs downloaded models (run with -m models)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
